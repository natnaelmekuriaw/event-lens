services:
  postgres:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    environment:
      POSTGRES_USER: verifier
      POSTGRES_PASSWORD: ${VERIFY_PASSWORD:?Generated by pnpm verify}
      POSTGRES_DB: eventlens_control
    ports: ['127.0.0.1::5432']
    volumes: [verify-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U verifier -d eventlens_control']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    command: [redis-server, --maxmemory-policy, noeviction]
    ports: ['127.0.0.1::6379']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  verify-postgres:
