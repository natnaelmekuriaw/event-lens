name: verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.25.0'
          run_install: false
      - name: Verify EventLens
        run: pnpm verify
      - name: Save browser failure details
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-details
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eventlens-benchmarks
          path: |
            .tmp/benchmark-ingestion.json
            .tmp/benchmark-analytics.json
            .tmp/benchmark-conversion-paths.json
            .tmp/benchmark-retention.json
            .tmp/benchmark-qualification.json
            .tmp/benchmark-sustained.json
            .tmp/release-rehearsal.json
            .tmp/screenshots/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
