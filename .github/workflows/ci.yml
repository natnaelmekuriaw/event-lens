name: verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
          run_install: false
      - name: Verify EventLens
        run: pnpm verify
      - name: Save browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-details
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eventlens-benchmarks
          path: |
            .tmp/benchmark-ingestion.json
            .tmp/benchmark-analytics.json
            .tmp/benchmark-conversion-paths.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
