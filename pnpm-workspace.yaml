packages:
  - apps/*
  - packages/*
  - examples/*
minimumReleaseAge: 1440
overrides:
  # Remove when Nest/Express resolve these patched versions themselves.
  'body-parser@>=2.0.0 <2.4.0': 2.4.0
  '@nestjs/platform-express@12.2.0>multer': 2.5.0
allowBuilds:
  '@nestjs/core': false
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@tailwindcss/oxide': true
  esbuild: true
  prisma: true
  sharp: true
  msgpackr-extract: false
