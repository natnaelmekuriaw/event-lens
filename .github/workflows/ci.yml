name: verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '11.25.0'
          run_install: false
      - name: Verify EventLens
        run: pnpm verify
      - name: Save browser failure details
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-details
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eventlens-benchmarks
          path: |
            .tmp/benchmark-ingestion.json
            .tmp/benchmark-analytics.json
            .tmp/benchmark-conversion-paths.json
            .tmp/benchmark-retention.json
            .tmp/benchmark-qualification.json
            .tmp/benchmark-sustained.json
            .tmp/release-rehearsal.json
            .tmp/screenshots/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
