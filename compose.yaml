name: eventlens
services:
  postgres:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm setup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup}
      POSTGRES_DB: ${POSTGRES_DB:-eventlens}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:8-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres-data:
    name: ${EVENTLENS_POSTGRES_VOLUME:?Set the existing PostgreSQL volume name explicitly; see docs/release-operations.md}
    external: true
  redis-data:
    name: ${EVENTLENS_REDIS_VOLUME:?Set the existing Redis volume name explicitly; see docs/release-operations.md}
    external: true
